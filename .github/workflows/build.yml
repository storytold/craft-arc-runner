name: Build and Push ARC Runner Image

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild to pick up DHI base image and actions-runner updates.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-publish:
    uses: storytold/craft-common-actions/.github/workflows/docker-build.yml@main
    with:
      images: |
        ghcr.io/storytold/craft-arc-runner
        docker.io/storytold/craft-arc-runner
      platforms: '[{"platform":"linux/amd64","runner":"ubuntu-26.04"}]'
      dhi-login: true
      cache-from: type=gha
      cache-to: type=gha,mode=max
    secrets: inherit
